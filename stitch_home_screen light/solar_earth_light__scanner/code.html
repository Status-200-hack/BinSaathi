<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Solar Earth Light: Scanner</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Space Grotesk -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f9a406",
                        "background-light": "#f8f7f5",
                        "background-dark": "#231c0f",
                        "stone-dark": "#181611",
                        "stone-medium": "#8c7c5f",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem", 
                        "2xl": "2rem",
                        "3xl": "2.5rem",
                        "full": "9999px"
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                },
            },
        }
    </script>
<style>
        /* Custom frosted glass utility */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
        }
        
        .glass-pill {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Scan line animation */
        @keyframes scan-vertical {
            0% { top: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }
        
        .animate-scan {
            animation: scan-vertical 2.5s ease-in-out infinite;
        }

        /* Floating tag float animation */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light text-stone-dark h-screen w-full overflow-hidden relative selection:bg-primary/30">
<!-- Full Screen Camera Viewfinder (Simulated) -->
<div class="absolute inset-0 z-0 bg-black">
<img alt="Hand holding a black smartphone over a wooden table" class="w-full h-full object-cover opacity-90" data-alt="Close up of a hand holding a black smartphone over a wooden table" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDdrP-DedGSJKJ84VGZL2uTK9syXoVJcc65c3D7z8B7pLkRbS59FmEqDx66KNjolsg80fshqXq76om_t4iqVk8vFuEfWenP7U2A2cD8B9ePmD96CFZ8LE2ARa9XPtgSOSEKqBeeWKh2bGBZaXJQk3eBtC9ma9rF57yGtNPRoJXN_dBQmymSyMif7WtWB1dTGTTFGFGQya4ANMriPOelYEX7s9FPDiPS9nCN-ccqj62rtmZZBhfZLnM86DhqlrT5kd7kyhYidGE1nkA"/>
<!-- Subtle gradient at top for status bar legibility -->
<div class="absolute inset-x-0 top-0 h-32 bg-gradient-to-b from-black/40 to-transparent pointer-events-none"></div>
</div>
<!-- Top Navigation Bar -->
<div class="absolute top-0 left-0 w-full z-30 flex items-center justify-between p-5 pt-12">
<!-- Flashlight Toggle -->
<button aria-label="Toggle Flashlight" class="glass-pill h-12 w-12 rounded-full flex items-center justify-center text-white active:bg-white/30 transition-colors">
<span class="material-symbols-outlined material-symbols-outlined" style="font-size: 24px;">flashlight_on</span>
</button>
<!-- Screen Title -->
<h1 class="text-white text-lg font-bold tracking-wide drop-shadow-md">Scanner</h1>
<!-- Close Button -->
<button aria-label="Close Scanner" class="glass-pill h-12 w-12 rounded-full flex items-center justify-center text-white active:bg-white/30 transition-colors">
<span class="material-symbols-outlined material-symbols-outlined" style="font-size: 24px;">close</span>
</button>
</div>
<!-- Central HUD Area -->
<div class="absolute inset-0 z-10 flex flex-col items-center justify-center pointer-events-none pb-20">
<!-- Floating Analysis Tag (Attached to object) -->
<div class="absolute z-20 top-[38%] animate-float">
<div class="flex flex-col items-center">
<!-- Tag -->
<div class="bg-primary shadow-[0_8px_16px_rgba(249,164,6,0.25)] text-white px-5 py-2.5 rounded-full flex items-center gap-2 transform transition-transform hover:scale-105">
<span class="material-symbols-outlined" style="font-size: 18px;">smartphone</span>
<span class="text-sm font-bold tracking-wide">iPhone 11 Pro</span>
</div>
<!-- Connector Line -->
<div class="h-6 w-0.5 bg-primary/80 mt-[-1px]"></div>
<!-- Connector Dot -->
<div class="h-3 w-3 bg-white border-2 border-primary rounded-full relative">
<div class="absolute inset-0 rounded-full bg-primary animate-ping opacity-75"></div>
</div>
</div>
</div>
<!-- Viewfinder Frame -->
<div class="relative w-[75%] aspect-[3/4] max-w-sm rounded-[2rem] border border-white/40 shadow-2xl overflow-hidden">
<!-- Semi-transparent fill to simulate focus -->
<div class="absolute inset-0 bg-white/5"></div>
<!-- Corner Markers -->
<div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-white rounded-tl-[1.5rem] m-2 opacity-90"></div>
<div class="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-white rounded-tr-[1.5rem] m-2 opacity-90"></div>
<div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-white rounded-bl-[1.5rem] m-2 opacity-90"></div>
<div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-white rounded-br-[1.5rem] m-2 opacity-90"></div>
<!-- Scanning Beam Animation -->
<div class="absolute left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-primary to-transparent shadow-[0_0_15px_2px_rgba(249,164,6,0.6)] animate-scan z-10"></div>
</div>
<!-- Helper Text -->
<div class="mt-8 bg-black/30 backdrop-blur-md px-4 py-2 rounded-full border border-white/10">
<p class="text-white/90 text-sm font-medium tracking-wide">Keep object centered</p>
</div>
</div>
<!-- Bottom Result Card -->
<div class="absolute bottom-0 left-0 w-full z-40 transition-transform duration-500 ease-out transform translate-y-0">
<div class="glass-panel rounded-t-[2.5rem] p-6 pb-8 shadow-[0_-10px_40px_rgba(0,0,0,0.1)]">
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-stone-200 rounded-full mx-auto mb-6 opacity-60"></div>
<!-- Content Grid -->
<div class="flex flex-col gap-6">
<!-- Header Info -->
<div class="flex items-start justify-between">
<div class="flex flex-col gap-1">
<div class="flex items-center gap-2">
<span class="flex items-center justify-center w-5 h-5 rounded-full bg-stone-100 text-stone-medium">
<span class="material-symbols-outlined" style="font-size: 14px; font-weight: 700;">center_focus_strong</span>
</span>
<span class="text-stone-medium text-xs font-bold uppercase tracking-wider">Item Detected</span>
</div>
<h2 class="text-3xl font-bold text-stone-dark tracking-tight">iPhone 11 Pro</h2>
</div>
<div class="flex flex-col items-end">
<span class="text-primary text-xl font-bold">94%</span>
<span class="text-stone-medium text-xs font-medium">Confidence</span>
</div>
</div>
<!-- Context Card -->
<div class="bg-background-light rounded-2xl p-4 border border-stone-200/50 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="bg-primary/10 p-2 rounded-xl text-primary">
<span class="material-symbols-outlined" style="font-size: 24px;">currency_exchange</span>
</div>
<div class="flex flex-col">
<span class="text-stone-dark font-bold text-sm">Estimated Value</span>
<span class="text-stone-medium text-xs">Based on current market data</span>
</div>
</div>
<span class="text-stone-dark font-bold text-lg">$120.00</span>
</div>
<!-- Action Button -->
<button class="group w-full bg-primary hover:bg-[#e09205] text-white font-bold h-14 rounded-2xl flex items-center justify-center gap-3 shadow-[0_4px_12px_rgba(249,164,6,0.3)] active:scale-[0.98] transition-all duration-200">
<span class="material-symbols-outlined group-hover:rotate-180 transition-transform duration-500">recycling</span>
<span class="text-lg">Confirm &amp; Recycle</span>
</button>
</div>
</div>
</div>
</body></html>
