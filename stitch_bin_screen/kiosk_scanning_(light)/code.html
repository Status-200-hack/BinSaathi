<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kiosk Scanning</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f9a406",
                        "primary-dark": "#d48b04",
                        "background-light": "#f8f7f5", // Soft Cream
                        "background-dark": "#231c0f",
                        "surface-light": "#ffffff",
                        "surface-dark": "#2d2415",
                        "text-main": "#181611",
                        "text-muted": "#6b665c",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Space Grotesk", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'radar': 'radar 2s linear infinite',
                    },
                    keyframes: {
                        radar: {
                            '0%': { transform: 'scale(0.8)', opacity: '1' },
                            '100%': { transform: 'scale(1.5)', opacity: '0' },
                        }
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Space Grotesk", sans-serif;
        }
        .radar-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 9999px;
            border: 2px solid #f9a406;
            opacity: 0;
            animation: radar-wave 3s infinite linear;
        }
        .radar-ring:nth-child(1) { animation-delay: 0s; }
        .radar-ring:nth-child(2) { animation-delay: 1s; }
        .radar-ring:nth-child(3) { animation-delay: 2s; }

        @keyframes radar-wave {
            0% { width: 100px; height: 100px; opacity: 1; border-width: 2px; }
            100% { width: 350px; height: 350px; opacity: 0; border-width: 0px; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-text-main font-display antialiased min-h-screen flex flex-col overflow-hidden relative">
<!-- Top App Bar -->
<header class="flex items-center justify-between p-6 z-20">
<button class="flex items-center justify-center w-12 h-12 rounded-full hover:bg-black/5 transition-colors text-text-main">
<span class="material-symbols-outlined text-[28px]">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="text-xs uppercase tracking-widest text-text-muted font-bold">Kiosk Interface</span>
<h2 class="text-lg font-bold">Bin #1234</h2>
</div>
<button class="flex items-center justify-center w-12 h-12 rounded-full hover:bg-black/5 transition-colors text-text-main">
<span class="material-symbols-outlined text-[28px]">help</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center relative z-10 w-full max-w-md mx-auto px-6 pb-8">
<!-- Central Radar Animation -->
<div class="relative w-full aspect-square max-w-[320px] flex items-center justify-center mb-8">
<!-- Radar Background Circles -->
<div class="absolute inset-0 border border-black/5 rounded-full"></div>
<div class="absolute inset-[15%] border border-black/5 rounded-full"></div>
<div class="absolute inset-[30%] border border-black/5 rounded-full"></div>
<!-- Animated Rings -->
<div class="radar-ring"></div>
<div class="radar-ring"></div>
<div class="radar-ring"></div>
<!-- Central Hub -->
<div class="relative z-10 w-32 h-32 bg-surface-light dark:bg-surface-dark rounded-full shadow-xl flex items-center justify-center border-4 border-background-light dark:border-background-dark">
<div class="w-24 h-24 bg-primary/10 rounded-full flex items-center justify-center animate-pulse-slow">
<span class="material-symbols-outlined text-primary text-[48px]">sensors</span>
</div>
</div>
<!-- Floating Decorative Elements (Industrial/Tech feel) -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-4 bg-background-light dark:bg-background-dark px-2 text-xs font-bold text-primary uppercase tracking-widest">Scanning</div>
<div class="absolute bottom-10 right-4 text-xs font-mono text-text-muted opacity-60">REF: 8X-99</div>
<div class="absolute top-10 left-4 text-xs font-mono text-text-muted opacity-60">SENS: ON</div>
</div>
<!-- Status Text -->
<div class="text-center mb-10 space-y-2">
<h1 class="text-3xl font-bold tracking-tight text-text-main uppercase">Analyzing item...</h1>
<p class="text-text-muted text-base max-w-[280px] mx-auto">Please wait while we categorize your e-waste using multi-sensor array.</p>
</div>
<!-- Sensor Dashboard -->
<div class="w-full grid grid-cols-1 gap-4">
<!-- Optics Card -->
<div class="bg-surface-light dark:bg-surface-dark p-4 rounded-xl shadow-sm border border-black/5 flex items-center gap-4 relative overflow-hidden group">
<div class="absolute right-0 top-0 bottom-0 w-1 bg-primary animate-pulse"></div>
<div class="w-12 h-12 bg-primary/10 rounded-lg flex items-center justify-center shrink-0 text-primary">
<span class="material-symbols-outlined">visibility</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-center mb-1">
<span class="text-sm font-bold text-text-main uppercase tracking-wide">Optics</span>
<span class="text-xs font-mono text-primary font-bold animate-pulse">SCANNING...</span>
</div>
<div class="w-full bg-black/5 rounded-full h-1.5">
<div class="bg-primary h-1.5 rounded-full w-[65%]" style="transition: width 0.5s ease;"></div>
</div>
</div>
</div>
<!-- Mass Card -->
<div class="bg-surface-light dark:bg-surface-dark p-4 rounded-xl shadow-sm border border-black/5 flex items-center gap-4 relative overflow-hidden group">
<div class="w-12 h-12 bg-black/5 dark:bg-white/5 rounded-lg flex items-center justify-center shrink-0 text-text-muted">
<span class="material-symbols-outlined">scale</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-center mb-1">
<span class="text-sm font-bold text-text-main uppercase tracking-wide">Mass</span>
<span class="text-xs font-mono text-text-muted">CALCULATING...</span>
</div>
<div class="w-full bg-black/5 rounded-full h-1.5">
<div class="bg-primary/50 h-1.5 rounded-full w-[30%]" style="transition: width 0.5s ease;"></div>
</div>
</div>
</div>
<!-- Dimensions Card -->
<div class="bg-surface-light dark:bg-surface-dark p-4 rounded-xl shadow-sm border border-black/5 flex items-center gap-4 relative overflow-hidden group">
<div class="w-12 h-12 bg-black/5 dark:bg-white/5 rounded-lg flex items-center justify-center shrink-0 text-text-muted">
<span class="material-symbols-outlined">straighten</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-center mb-1">
<span class="text-sm font-bold text-text-main uppercase tracking-wide">Dimensions</span>
<span class="text-xs font-mono text-text-muted">PENDING</span>
</div>
<div class="w-full bg-black/5 rounded-full h-1.5">
<div class="bg-primary/20 h-1.5 rounded-full w-[10%]" style="transition: width 0.5s ease;"></div>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Actions -->
<footer class="p-6 w-full max-w-md mx-auto z-20">
<button class="w-full py-4 rounded-xl border-2 border-black/10 text-text-muted font-bold uppercase tracking-wider hover:bg-black/5 hover:text-text-main transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg">close</span>
            Cancel Session
        </button>
</footer>
<!-- Background Decoration Gradient -->
<div class="absolute bottom-0 left-0 right-0 h-1/3 bg-gradient-to-t from-primary/5 to-transparent pointer-events-none z-0"></div>
</body></html>
