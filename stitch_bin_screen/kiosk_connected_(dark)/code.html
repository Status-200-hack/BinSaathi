<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kiosk Connected</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f9a406",
                        "background-light": "#f8f7f5",
                        "background-dark": "#231c0f",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                    animation: {
                        'bounce-slow': 'bounce 2s infinite',
                    }
                },
            },
        }
    </script>
<style>
        /* Custom pattern for industrial feel */
        .industrial-grid {
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col justify-between overflow-x-hidden industrial-grid">
<!-- Header Section: Connection Status -->
<div class="flex flex-col items-center justify-center pt-16 pb-8 px-6 animate-fade-in">
<div class="relative mb-8">
<!-- Pulsing effect behind icon -->
<div class="absolute inset-0 bg-primary/20 rounded-full blur-xl animate-pulse"></div>
<div class="relative bg-background-dark border border-primary/30 rounded-full p-8 flex items-center justify-center shadow-[0_0_15px_rgba(249,164,6,0.3)]">
<span class="material-symbols-outlined text-primary text-[64px]">link</span>
</div>
<!-- Checkmark badge -->
<div class="absolute -bottom-2 -right-2 bg-green-500 rounded-full p-2 border-4 border-background-dark flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[20px] font-bold">check</span>
</div>
</div>
<h1 class="text-white text-3xl font-bold tracking-tight text-center mb-2">Connected to your phone</h1>
<p class="text-white/60 text-lg font-medium text-center">Device linked successfully</p>
</div>
<!-- Main Content: Bin ID Card -->
<div class="flex-1 flex flex-col items-center justify-center px-4 w-full">
<div class="w-full max-w-md relative group">
<!-- Decorative corner markers for industrial look -->
<div class="absolute -top-1 -left-1 w-4 h-4 border-t-2 border-l-2 border-primary"></div>
<div class="absolute -top-1 -right-1 w-4 h-4 border-t-2 border-r-2 border-primary"></div>
<div class="absolute -bottom-1 -left-1 w-4 h-4 border-b-2 border-l-2 border-primary"></div>
<div class="absolute -bottom-1 -right-1 w-4 h-4 border-b-2 border-r-2 border-primary"></div>
<div class="bg-[#181611] border border-white/10 rounded-lg p-6 flex flex-col items-center justify-center shadow-2xl relative overflow-hidden">
<!-- Subtle background gradient within card -->
<div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent pointer-events-none"></div>
<div class="flex items-center gap-2 mb-4 bg-white/5 px-3 py-1 rounded-full border border-white/10">
<span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
<span class="text-xs uppercase tracking-widest text-white/70 font-semibold">System Active</span>
</div>
<div class="flex flex-col items-center gap-1 z-10">
<span class="text-white/50 text-sm font-medium uppercase tracking-wider">Target Unit</span>
<h2 class="text-5xl font-bold text-white tracking-tight">Bin ID: <span class="text-primary">A23</span></h2>
</div>
</div>
</div>
</div>
<!-- Footer Action: Instruction & Arrow -->
<div class="pb-12 pt-8 px-6 flex flex-col items-center gap-8 bg-gradient-to-t from-background-dark to-transparent">
<div class="flex flex-col items-center gap-2">
<h3 class="text-white text-[32px] font-bold leading-tight text-center">Place your item inside</h3>
<p class="text-white/60 text-base text-center max-w-[280px]">The hatch is now unlocked. Please deposit your e-waste below.</p>
</div>
<!-- Animated Arrow Area -->
<div class="flex flex-col items-center gap-4 animate-bounce-slow">
<div class="bg-primary text-background-dark p-4 rounded-full shadow-[0_0_20px_rgba(249,164,6,0.4)] hover:shadow-[0_0_30px_rgba(249,164,6,0.6)] transition-shadow duration-300 cursor-pointer">
<span class="material-symbols-outlined text-[48px] block transform rotate-0">arrow_downward</span>
</div>
<span class="text-primary text-sm font-bold uppercase tracking-widest opacity-80">Insert Here</span>
</div>
<!-- Bottom Safety Stripe -->
<div class="w-full h-2 mt-4 rounded-full overflow-hidden opacity-30">
<div class="w-full h-full" style="background: repeating-linear-gradient(45deg, #f9a406, #f9a406 10px, #231c0f 10px, #231c0f 20px);"></div>
</div>
</div>
</body></html>
