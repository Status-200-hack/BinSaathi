<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kiosk Scanning Screen</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
            extend: {
                colors: {
                "primary": "#f9a406", // Amber
                "background-light": "#f8f7f5",
                "background-dark": "#181611", // Deep Charcoal/Almost Black from example
                "surface-dark": "#231c0f",
                },
                fontFamily: {
                "display": ["Space Grotesk", "sans-serif"]
                },
                borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                backgroundImage: {
                    'radar-gradient': 'radial-gradient(circle, rgba(249, 164, 6, 0.2) 0%, rgba(249, 164, 6, 0.05) 50%, transparent 70%)',
                }
            },
            },
        }
    </script>
<style>
        /* Custom utilities for the radar effect since we can't use JS animation */
        .radar-circle {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(249, 164, 6, 0.3);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .radar-scan-line {
            background: linear-gradient(180deg, rgba(249,164,6,0) 0%, rgba(249,164,6,0.5) 100%);
            height: 50%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            border-bottom: 2px solid #f9a406;
            opacity: 0.6;
        }

        .sensor-active {
            box-shadow: 0 0 15px rgba(249, 164, 6, 0.3);
            border-color: #f9a406;
            color: #f9a406;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display flex flex-col min-h-screen text-slate-900 dark:text-white overflow-hidden">
<!-- Header -->
<header class="flex items-center justify-between p-4 pb-2 z-10">
<button class="flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-white/10 transition-colors text-white">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center uppercase">System Active</h2>
<button class="flex h-10 px-4 items-center justify-center rounded-lg bg-white/10 hover:bg-white/20 transition-colors text-white text-sm font-bold tracking-wide uppercase">
            Cancel
        </button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col relative w-full h-full justify-between pb-8">
<!-- Scanner Visualization Container -->
<div class="relative flex-1 flex flex-col items-center justify-center w-full min-h-[400px]">
<!-- Item Preview (Background) -->
<div class="absolute inset-0 flex items-center justify-center opacity-40 z-0">
<div class="w-64 h-64 bg-center bg-no-repeat bg-contain" data-alt="Outline of an electronic circuit board or device component" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAojnyI9pIb33b4Kn4zMB_3p6gFCS6-9oNad00MVQPuePuS00tKbu7tZPBatUeFhs5Y433BVFZAtTVaF6Nl3iTl8r3Jz5C8sfXCWjdZ4uUF0h9uxymjWjIlx5neEyJIJwbExoj0Cm2b0lKaLUMr3yodmTZ4hiH2DR43GpQB1s4BZxTriey5hs0liHci9WObKswafH2VqL5KhoXo_F0NWnJ595wfx8wygx_3R8fq2BoTIuRSKwSGRKc8nxAJrRRPMXrBwHxXHpnon5I'); filter: grayscale(100%) contrast(120%);">
</div>
</div>
<!-- Radar Visual Effect -->
<div class="relative w-80 h-80 z-10">
<!-- Concentric Circles -->
<div class="radar-circle w-full h-full border border-primary/20 bg-primary/5"></div>
<div class="radar-circle w-[75%] h-[75%] border border-primary/40"></div>
<div class="radar-circle w-[50%] h-[50%] border border-primary/60"></div>
<div class="radar-circle w-[25%] h-[25%] border border-primary bg-primary/20 shadow-[0_0_20px_rgba(249,164,6,0.5)]"></div>
<!-- Crosshairs -->
<div class="absolute top-1/2 left-0 w-full h-[1px] bg-primary/30"></div>
<div class="absolute left-1/2 top-0 h-full w-[1px] bg-primary/30"></div>
<!-- Scanning Sweep Simulation (Static) -->
<div class="absolute inset-0 rounded-full overflow-hidden opacity-30">
<div class="absolute w-full h-1/2 top-0 bg-gradient-to-t from-primary/40 to-transparent border-b-2 border-primary"></div>
</div>
<!-- Corner Brackets -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-primary rounded-tl-lg"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-primary rounded-tr-lg"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-primary rounded-bl-lg"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-primary rounded-br-lg"></div>
</div>
<!-- Status Text -->
<div class="mt-12 text-center z-20 px-6">
<h1 class="text-primary tracking-widest text-[32px] font-bold leading-tight uppercase drop-shadow-[0_0_10px_rgba(249,164,6,0.5)]">
                    Analyzing Item...
                </h1>
<p class="text-gray-400 text-base font-normal mt-2 max-w-xs mx-auto">
                    Please keep the object steady while we identify material composition.
                </p>
</div>
</div>
<!-- Bottom Sensor Array & Progress -->
<div class="flex flex-col gap-6 p-6 w-full max-w-md mx-auto z-20">
<!-- Progress Bar -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<span class="text-xs font-bold text-primary uppercase tracking-widest">System Confidence</span>
<span class="text-lg font-mono font-bold text-white">78%</span>
</div>
<div class="h-1.5 w-full bg-surface-dark rounded-full overflow-hidden border border-white/10">
<div class="h-full bg-primary shadow-[0_0_10px_#f9a406]" style="width: 78%"></div>
</div>
</div>
<!-- Active Hardware Indicators -->
<div class="grid grid-cols-3 gap-3">
<!-- Visual Sensor -->
<div class="flex flex-col items-center gap-2 p-3 rounded-xl bg-surface-dark border border-primary/50 sensor-active">
<span class="material-symbols-outlined text-[28px]">visibility</span>
<span class="text-[10px] font-bold uppercase tracking-wider text-white">Visual</span>
<div class="h-1 w-1 rounded-full bg-primary animate-pulse"></div>
</div>
<!-- Weight Sensor -->
<div class="flex flex-col items-center gap-2 p-3 rounded-xl bg-surface-dark border border-white/10 text-gray-500">
<span class="material-symbols-outlined text-[28px]">scale</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Weight</span>
<div class="h-1 w-1 rounded-full bg-gray-600"></div>
</div>
<!-- Dimension Sensor -->
<div class="flex flex-col items-center gap-2 p-3 rounded-xl bg-surface-dark border border-primary/30 text-primary/80">
<span class="material-symbols-outlined text-[28px]">straighten</span>
<span class="text-[10px] font-bold uppercase tracking-wider text-white">Size</span>
<div class="h-1 w-1 rounded-full bg-primary/50"></div>
</div>
</div>
</div>
</main>
<!-- Decorative industrial footer element -->
<div class="h-1 w-full bg-gradient-to-r from-transparent via-primary/50 to-transparent"></div>
</body></html>
