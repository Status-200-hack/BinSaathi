<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kiosk Connected Screen</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f9a406",
                        "background-light": "#FFFDF5", /* Tweaked for Soft Cream request */
                        "background-dark": "#231c0f",
                        "text-dark": "#2D261E",
                        "surface-cream": "#F2F0E9",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem", 
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'industrial': '4px 4px 0px 0px rgba(45, 38, 30, 0.1)',
                        'industrial-hover': '2px 2px 0px 0px rgba(45, 38, 30, 0.1)',
                    }
                },
            },
        }
    </script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        /* Custom Animation for the downward arrow */
        @keyframes bounce-down {
            0%, 100% {
                transform: translateY(-25%);
                animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
            }
            50% {
                transform: translateY(0);
                animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
            }
        }
        .animate-bounce-slow {
            animation: bounce-down 2s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased min-h-screen flex flex-col items-center justify-center selection:bg-primary selection:text-white">
<!-- Main Container -->
<main class="relative w-full max-w-md h-full min-h-screen flex flex-col p-6 mx-auto overflow-hidden bg-background-light dark:bg-background-dark">
<!-- Status Indicator -->
<header class="flex items-center justify-center gap-2 pt-8 pb-4 opacity-80">
<span class="relative flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-500 opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-green-600"></span>
</span>
<p class="text-text-dark dark:text-gray-300 font-medium uppercase tracking-widest text-xs">Live Connection</p>
</header>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col items-center justify-center w-full gap-8">
<!-- Hero Icon: Connected -->
<div class="relative flex items-center justify-center w-48 h-48 rounded-full bg-primary/10 dark:bg-primary/5">
<div class="absolute inset-0 rounded-full border border-primary/20 scale-125"></div>
<div class="absolute inset-0 rounded-full border border-dashed border-primary/30 scale-150 animate-[spin_10s_linear_infinite]"></div>
<span class="material-symbols-outlined text-primary text-[80px]" style="font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 48;">
                    link
                </span>
<!-- Floating device icons to reinforce connection -->
<div class="absolute -top-2 right-4 bg-white dark:bg-gray-800 p-2 rounded-full shadow-industrial border border-surface-cream">
<span class="material-symbols-outlined text-text-dark dark:text-white text-2xl">smartphone</span>
</div>
<div class="absolute -bottom-2 left-4 bg-white dark:bg-gray-800 p-2 rounded-full shadow-industrial border border-surface-cream">
<span class="material-symbols-outlined text-text-dark dark:text-white text-2xl">recycling</span>
</div>
</div>
<!-- Main Headline -->
<div class="text-center space-y-2 max-w-xs mx-auto">
<h1 class="text-text-dark dark:text-white text-4xl font-bold leading-tight tracking-tight">
                    Connected to your phone
                </h1>
<p class="text-text-dark/60 dark:text-gray-400 text-lg">
                    Device synced successfully
                </p>
</div>
<!-- Bin ID Card -->
<div class="w-full">
<div class="relative overflow-hidden bg-surface-cream dark:bg-gray-800 border-2 border-text-dark/10 dark:border-white/10 rounded-2xl p-6 shadow-industrial">
<!-- Industrial pattern background -->
<div class="absolute top-0 right-0 p-4 opacity-5">
<span class="material-symbols-outlined text-9xl">qr_code_2</span>
</div>
<div class="relative z-10 flex flex-col items-start gap-1">
<span class="text-xs font-bold tracking-[0.2em] text-text-dark/50 dark:text-gray-500 uppercase">Identifying Unit</span>
<div class="flex items-baseline gap-2">
<span class="text-2xl text-text-dark/70 dark:text-gray-400 font-medium">BIN ID:</span>
<span class="text-4xl font-bold text-primary tracking-tight">A23</span>
</div>
</div>
<!-- Decorative screws/rivets -->
<div class="absolute top-3 left-3 w-1.5 h-1.5 rounded-full bg-text-dark/20"></div>
<div class="absolute top-3 right-3 w-1.5 h-1.5 rounded-full bg-text-dark/20"></div>
<div class="absolute bottom-3 left-3 w-1.5 h-1.5 rounded-full bg-text-dark/20"></div>
<div class="absolute bottom-3 right-3 w-1.5 h-1.5 rounded-full bg-text-dark/20"></div>
</div>
</div>
</div>
<!-- Action Footer -->
<div class="flex flex-col items-center justify-end w-full pb-8 pt-10 gap-6">
<div class="flex flex-col items-center gap-4">
<p class="text-text-dark dark:text-white text-xl font-medium tracking-wide">Place your item inside</p>
<div class="flex flex-col items-center justify-center text-primary animate-bounce-slow">
<div class="w-16 h-16 flex items-center justify-center rounded-full bg-primary/20 dark:bg-primary/10 mb-2 border-2 border-primary">
<span class="material-symbols-outlined text-4xl font-bold">arrow_downward</span>
</div>
</div>
</div>
<button class="text-sm font-medium text-text-dark/40 dark:text-gray-500 hover:text-red-500 transition-colors flex items-center gap-1 mt-4">
<span class="material-symbols-outlined text-base">close</span>
                Disconnect &amp; Cancel
            </button>
</div>
<!-- Background Graphic Elements -->
<div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-primary/5 to-transparent pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-full h-32 bg-gradient-to-t from-background-light dark:from-background-dark to-transparent pointer-events-none z-10"></div>
</main>
</body></html>
