<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kiosk Success Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#f9bc06",
              "background-light": "#f8f8f5",
              "background-dark": "#231e0f",
              "charcoal-dark": "#1a1814",
              "charcoal-light": "#2c2a24",
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'progress': 'progress 5s linear forwards',
            },
            keyframes: {
              progress: {
                '0%': { width: '100%' },
                '100%': { width: '0%' },
              }
            }
          },
        },
      }
    </script>
<style>
      /* Additional custom styles for specific effects */
      .bg-grid-pattern {
        background-image: radial-gradient(rgba(249, 188, 6, 0.1) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      
      .glow-effect {
        box-shadow: 0 0 60px -15px rgba(249, 188, 6, 0.3);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display h-screen w-full flex flex-col overflow-hidden select-none">
<!-- Main Content Container -->
<div class="relative flex flex-col h-full w-full max-w-md mx-auto bg-background-light dark:bg-charcoal-dark shadow-2xl overflow-hidden">
<!-- Abstract Background Pattern -->
<div class="absolute inset-0 z-0 opacity-20 bg-grid-pattern pointer-events-none"></div>
<div class="absolute top-0 right-0 w-64 h-64 bg-primary/10 rounded-full blur-[80px] -translate-y-1/2 translate-x-1/2"></div>
<div class="absolute bottom-0 left-0 w-80 h-80 bg-primary/5 rounded-full blur-[100px] translate-y-1/3 -translate-x-1/3"></div>
<!-- Header / Top Bar (Empty for immersive kiosk feel, but preserving space) -->
<div class="relative z-10 w-full h-16"></div>
<!-- Center Content Area -->
<div class="relative z-10 flex-1 flex flex-col items-center justify-center p-8 text-center space-y-8">
<!-- Success Icon Animation Container -->
<div class="relative group">
<!-- Glowing rings behind icon -->
<div class="absolute inset-0 bg-primary/20 rounded-full blur-xl scale-150 animate-pulse-slow"></div>
<!-- Main Icon Circle -->
<div class="relative flex items-center justify-center w-32 h-32 rounded-full border-4 border-primary bg-charcoal-light shadow-2xl glow-effect">
<span class="material-symbols-outlined text-primary text-[64px] font-bold">check</span>
</div>
</div>
<!-- Primary Message -->
<div class="space-y-4 max-w-xs mx-auto">
<h1 class="text-4xl font-bold tracking-tight text-gray-900 dark:text-white leading-tight">
                    Item recycled <br/>
<span class="text-primary">successfully</span>
</h1>
<!-- Secondary Feedback -->
<p class="text-lg text-gray-600 dark:text-gray-400 font-medium leading-relaxed">
                    Impact stats &amp; rewards have been sent to your phone
                </p>
</div>
<!-- Abstract Visual / Divider -->
<div class="w-16 h-1 rounded-full bg-gradient-to-r from-transparent via-primary/50 to-transparent"></div>
</div>
<!-- Bottom Section: Countdown & Footer -->
<div class="relative z-10 w-full p-6 pb-10 bg-gradient-to-t from-background-light dark:from-background-dark to-transparent">
<div class="flex flex-col gap-4">
<!-- Countdown Text -->
<div class="flex items-center justify-between px-1">
<span class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-widest">System Reset</span>
<span class="text-base font-bold text-primary tabular-nums">5s</span>
</div>
<!-- Progress Bar -->
<div class="w-full h-2 bg-gray-200 dark:bg-charcoal-light rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full animate-[progress_5s_linear_forwards]" style="width: 100%;"></div>
</div>
<!-- Footer Info -->
<p class="text-xs text-center text-gray-400 dark:text-gray-600 mt-2 font-mono opacity-60">
                    ID: K-29402 // SOLAR EARTH v2.4
                </p>
</div>
</div>
</div>
</body></html>
