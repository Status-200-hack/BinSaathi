<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kiosk Result - Smart Bin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f9a406",
                        "background-light": "#f8f7f5",
                        "background-dark": "#181611", // Deep Charcoal
                        "surface-dark": "#231c0f",
                        "success": "#4ade80",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .pulse-ring {
            box-shadow: 0 0 0 0 rgba(249, 164, 6, 0.7);
            animation: pulse-ring 2s infinite cubic-bezier(0.66, 0, 0, 1);
        }
        @keyframes pulse-ring {
            0% {
                box-shadow: 0 0 0 0 rgba(249, 164, 6, 0.7);
            }
            70% {
                box-shadow: 0 0 0 20px rgba(249, 164, 6, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(249, 164, 6, 0);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col items-center justify-center selection:bg-primary selection:text-background-dark">
<div class="w-full max-w-md h-screen flex flex-col relative overflow-hidden bg-background-light dark:bg-background-dark shadow-2xl">
<!-- Header -->
<header class="flex items-center justify-between p-6 z-10">
<div class="flex items-center gap-3 text-gray-800 dark:text-white">
<span class="material-symbols-outlined text-primary text-[28px]">recycling</span>
<span class="font-bold text-lg tracking-tight">EcoBin #402</span>
</div>
<div class="flex items-center gap-2 bg-gray-200 dark:bg-surface-dark px-3 py-1.5 rounded-full">
<div class="w-2 h-2 rounded-full bg-success animate-pulse"></div>
<span class="text-xs font-medium uppercase tracking-wider text-gray-600 dark:text-gray-400">Online</span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center px-6 relative z-10 w-full">
<!-- Animated Result Container -->
<div class="relative mb-10 flex items-center justify-center">
<!-- Background Glow -->
<div class="absolute inset-0 bg-primary/20 blur-[60px] rounded-full transform scale-150"></div>
<!-- Icon Circle -->
<div class="relative w-48 h-48 rounded-full border-[3px] border-primary/30 flex items-center justify-center bg-surface-dark pulse-ring">
<span class="material-symbols-outlined text-primary text-[6rem] drop-shadow-[0_0_15px_rgba(249,164,6,0.5)]">smartphone</span>
</div>
<!-- Confidence Badge floating -->
<div class="absolute -bottom-4 bg-surface-dark border border-gray-700 dark:border-gray-800 px-1 py-1 rounded-full shadow-lg">
<div class="flex items-center gap-2 bg-success/10 px-4 py-1.5 rounded-full border border-success/20">
<span class="material-symbols-outlined text-success text-sm">check_circle</span>
<span class="text-success text-sm font-bold tracking-wide uppercase">High Confidence</span>
</div>
</div>
</div>
<!-- Text Result -->
<div class="text-center space-y-2 mb-12">
<p class="text-gray-500 dark:text-gray-400 text-sm font-medium uppercase tracking-[0.2em]">Object Analysis</p>
<h1 class="text-gray-900 dark:text-white text-5xl font-bold leading-none tracking-tight">
                    Detected: <br/>
<span class="text-primary">Phone</span>
</h1>
</div>
<!-- Action Buttons -->
<div class="w-full space-y-4">
<button class="w-full group relative flex items-center justify-center gap-3 bg-primary hover:bg-primary/90 text-background-dark h-16 rounded-full transition-all active:scale-[0.98]">
<span class="text-xl font-bold tracking-wide">Confirm &amp; Recycle</span>
<span class="material-symbols-outlined text-2xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<button class="w-full flex items-center justify-center gap-2 bg-transparent border-2 border-gray-300 dark:border-gray-700 text-gray-600 dark:text-gray-300 h-14 rounded-full hover:bg-gray-100 dark:hover:bg-white/5 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-xl">replay</span>
<span class="text-base font-bold">Incorrect? Retake Scan</span>
</button>
</div>
</main>
<!-- Footer / Status -->
<footer class="p-6 pt-0 z-10 w-full">
<div class="bg-gray-100 dark:bg-surface-dark rounded-2xl p-4 flex items-center justify-between border border-gray-200 dark:border-white/5">
<div class="flex flex-col">
<span class="text-xs text-gray-500 dark:text-gray-400 uppercase tracking-wider font-semibold">Bin Capacity</span>
<span class="text-gray-900 dark:text-white font-bold text-lg">45% Full</span>
</div>
<!-- Mini visual bar graph for capacity -->
<div class="flex gap-1 h-8 items-end">
<div class="w-2 bg-primary rounded-t-sm h-[80%]"></div>
<div class="w-2 bg-primary/40 rounded-t-sm h-[40%]"></div>
<div class="w-2 bg-primary/20 rounded-t-sm h-[60%]"></div>
<div class="w-2 bg-gray-700 rounded-t-sm h-[20%]"></div>
</div>
</div>
</footer>
<!-- Decorative Pattern Background -->
<div class="absolute inset-0 pointer-events-none opacity-5" data-alt="Abstract dot pattern background" style="background-image: radial-gradient(#f9a406 1px, transparent 1px); background-size: 24px 24px;">
</div>
</div>
</body></html>
