<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kiosk Result</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#f9a406",
              "background-light": "#f8f7f5",
              "background-dark": "#231c0f",
              "surface-light": "#ffffff",
              "surface-dark": "#2d2415",
              "text-main": "#181611",
              "text-muted": "#8c7c5f",
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"],
              "sans": ["Space Grotesk", "sans-serif"]
            },
            borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
          },
        },
      }
    </script>
<style>
      body {
        font-family: 'Space Grotesk', sans-serif;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-center font-display antialiased text-text-main">
<div class="relative flex h-full min-h-screen w-full max-w-md flex-col overflow-hidden bg-background-light dark:bg-background-dark shadow-2xl">
<!-- Header -->
<header class="flex items-center justify-between p-6 pb-2">
<button class="flex h-12 w-12 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-text-main dark:text-white transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">close</span>
</button>
<div class="flex items-center gap-2">
<div class="h-2 w-2 rounded-full bg-green-500 animate-pulse"></div>
<h2 class="text-text-main dark:text-white text-sm font-bold tracking-wider uppercase">Scanner Active</h2>
</div>
<button class="flex h-12 items-center justify-center rounded-lg px-2 text-text-muted hover:text-primary transition-colors">
<span class="text-sm font-bold tracking-wide">HELP</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center px-6 py-8 gap-8">
<!-- Hero Icon -->
<div class="relative flex items-center justify-center w-64 h-64 rounded-full bg-surface-light dark:bg-surface-dark shadow-sm border-4 border-primary/10">
<div class="absolute inset-0 bg-primary/5 rounded-full animate-ping opacity-20"></div>
<!-- Large Minimalist Smartphone Icon -->
<span class="material-symbols-outlined text-primary" style="font-size: 120px; font-variation-settings: 'FILL' 0, 'wght' 600;">smartphone</span>
<!-- Confidence Badge overlaid -->
<div class="absolute -bottom-4 bg-[#e8f5e9] dark:bg-[#1b4d2e] border border-green-200 dark:border-green-800 text-green-800 dark:text-green-100 px-4 py-2 rounded-full flex items-center gap-2 shadow-sm">
<span class="material-symbols-outlined text-green-600 dark:text-green-300" style="font-size: 20px; font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-sm font-bold tracking-wide">High Confidence</span>
</div>
</div>
<!-- Text Content -->
<div class="text-center space-y-3 mt-4">
<h1 class="text-text-main dark:text-white text-4xl font-bold leading-tight tracking-tight uppercase">
                    Detected:<br/><span class="text-primary">Phone</span>
</h1>
<p class="text-text-muted text-lg font-medium max-w-[280px] mx-auto leading-relaxed">
                    Estimated Value: Recyclable Materials &amp; Rare Earth Metals
                </p>
</div>
<!-- Additional Info Card (Optional but adds context) -->
<div class="w-full bg-surface-light dark:bg-surface-dark rounded-xl p-4 flex items-center gap-4 border border-black/5 dark:border-white/5">
<div class="bg-background-light dark:bg-background-dark h-12 w-12 rounded-lg flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-text-muted" style="font-size: 24px;">eco</span>
</div>
<div class="flex-1">
<p class="text-text-main dark:text-white text-sm font-bold">Environmental Impact</p>
<p class="text-text-muted text-xs">Saves approx. 0.2g of gold</p>
</div>
</div>
</main>
<!-- Footer Actions -->
<footer class="p-6 flex flex-col gap-4 bg-background-light dark:bg-background-dark pb-10">
<!-- Primary Action -->
<button class="group relative flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-16 bg-primary text-text-main text-lg font-bold tracking-wide shadow-lg shadow-primary/20 hover:shadow-primary/40 transition-all active:scale-[0.98]">
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
<span class="relative z-10 flex items-center gap-2">
                    Confirm &amp; Recycle
                    <span class="material-symbols-outlined" style="font-size: 24px;">arrow_forward</span>
</span>
</button>
<!-- Secondary Action -->
<button class="flex w-full cursor-pointer items-center justify-center rounded-xl h-12 bg-transparent border-2 border-black/10 dark:border-white/10 text-text-main dark:text-white text-sm font-bold tracking-wide hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                Incorrect Item?
            </button>
<!-- Version/Variant Text -->
<div class="flex justify-center mt-2">
<p class="text-text-muted/60 text-[10px] uppercase font-bold tracking-widest">Variant 10 of 12</p>
</div>
</footer>
</div>
</body></html>
