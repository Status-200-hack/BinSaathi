<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Recycling Success Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f9a406",
                        "background-light": "#f8f7f5",
                        "background-dark": "#231c0f",
                        "surface-dark": "#312a1e",
                        "clay": "#8D6E63", 
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Glassmorphism utility */
        .glass-card {
            background: rgba(49, 42, 30, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(249, 164, 6, 0.15);
        }
        .bg-gradient-radial {
            background-image: radial-gradient(var(--tw-gradient-stops));
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col items-center justify-center relative overflow-hidden text-slate-900 dark:text-white antialiased">
<!-- Ambient Background Glow -->
<div class="absolute top-[-20%] left-[-10%] w-[120%] h-[60%] bg-primary/10 dark:bg-primary/5 rounded-full blur-[100px] pointer-events-none z-0"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[80%] h-[40%] bg-clay/20 dark:bg-clay/10 rounded-full blur-[80px] pointer-events-none z-0"></div>
<!-- Main Content Container -->
<div class="relative w-full max-w-md h-full min-h-screen flex flex-col z-10 px-6 py-8">
<!-- Top Navigation Area -->
<div class="flex items-center justify-between mb-8">
<button class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl dark:text-gray-300">close</span>
</button>
<span class="text-sm font-medium tracking-wide text-gray-500 dark:text-gray-400 uppercase">Recycling Complete</span>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
<!-- Celebration Section -->
<div class="flex-1 flex flex-col items-center justify-center text-center mt-4">
<!-- Animated Icon Container -->
<div class="relative mb-8">
<div class="absolute inset-0 bg-primary/20 blur-xl rounded-full scale-150 animate-pulse"></div>
<div class="relative size-24 bg-gradient-to-br from-primary to-orange-600 rounded-full flex items-center justify-center shadow-[0_0_40px_rgba(249,164,6,0.4)]">
<span class="material-symbols-outlined text-background-dark text-6xl font-bold">check</span>
</div>
</div>
<h2 class="text-2xl font-bold mb-2">Recycle Successful!</h2>
<div class="flex flex-col items-center mb-10">
<h1 class="text-6xl font-bold text-primary tracking-tighter drop-shadow-sm">+500</h1>
<span class="text-primary text-xl font-medium tracking-widest uppercase mt-1">Points</span>
<p class="text-gray-500 dark:text-gray-400 text-sm mt-3 font-medium">Added to your Solar Wallet</p>
</div>
<!-- Impact Glass Card -->
<div class="w-full glass-card rounded-2xl p-6 mb-6">
<div class="flex items-center justify-between mb-4 pb-4 border-b border-white/10 dark:border-white/5">
<h3 class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Environmental Impact</h3>
<span class="material-symbols-outlined text-primary/80">public</span>
</div>
<div class="grid grid-cols-2 gap-4">
<!-- Stat 1 -->
<div class="flex flex-col items-start gap-1 p-3 rounded-xl bg-white/50 dark:bg-white/5 hover:bg-white/80 dark:hover:bg-white/10 transition-colors">
<div class="flex items-center gap-2 text-clay dark:text-[#d7ccc8] mb-1">
<span class="material-symbols-outlined text-[20px]">cloud_off</span>
<span class="text-xs font-bold uppercase">CO2 Saved</span>
</div>
<span class="text-xl font-bold dark:text-white">2.4<span class="text-sm font-normal text-gray-500 ml-1">kg</span></span>
</div>
<!-- Stat 2 -->
<div class="flex flex-col items-start gap-1 p-3 rounded-xl bg-white/50 dark:bg-white/5 hover:bg-white/80 dark:hover:bg-white/10 transition-colors">
<div class="flex items-center gap-2 text-primary dark:text-primary mb-1">
<span class="material-symbols-outlined text-[20px] fill-1">bolt</span>
<span class="text-xs font-bold uppercase">Energy</span>
</div>
<span class="text-xl font-bold dark:text-white">12<span class="text-sm font-normal text-gray-500 ml-1">kWh</span></span>
</div>
<!-- Stat 3 -->
<div class="flex flex-col items-start gap-1 p-3 rounded-xl bg-white/50 dark:bg-white/5 hover:bg-white/80 dark:hover:bg-white/10 transition-colors">
<div class="flex items-center gap-2 text-emerald-600 dark:text-emerald-400 mb-1">
<span class="material-symbols-outlined text-[20px]">recycling</span>
<span class="text-xs font-bold uppercase">Recovered</span>
</div>
<span class="text-xl font-bold dark:text-white">0.5<span class="text-sm font-normal text-gray-500 ml-1">g Au</span></span>
</div>
<!-- Stat 4 -->
<div class="flex flex-col items-start gap-1 p-3 rounded-xl bg-white/50 dark:bg-white/5 hover:bg-white/80 dark:hover:bg-white/10 transition-colors">
<div class="flex items-center gap-2 text-blue-500 dark:text-blue-400 mb-1">
<span class="material-symbols-outlined text-[20px]">water_drop</span>
<span class="text-xs font-bold uppercase">Water</span>
</div>
<span class="text-xl font-bold dark:text-white">140<span class="text-sm font-normal text-gray-500 ml-1">L</span></span>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="flex flex-col gap-3 mt-auto pt-6 w-full">
<button class="w-full bg-primary hover:bg-amber-400 text-background-dark font-bold text-lg py-4 px-6 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Recycle Another Item</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<button class="w-full bg-transparent border border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-white/5 font-medium text-base py-4 px-6 rounded-xl active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">receipt_long</span>
<span>View Receipt</span>
</button>
</div>
</div>
</body></html>
