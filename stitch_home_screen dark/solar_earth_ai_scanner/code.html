<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Solar Earth AI Scanner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f9a406",
                        "background-light": "#f8f7f5",
                        "background-dark": "#231c0f",
                        "warm-charcoal": "#1a1a1a",
                        "soft-clay": "#8D7B68",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px"},
                    backdropBlur: {
                        xs: '2px',
                    }
                },
            },
        }
    </script>
<style>
        /* Custom animations for the scanner */
        @keyframes scan-pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
        @keyframes scan-line {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .animate-scan-pulse {
            animation: scan-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .animate-scan-line {
            animation: scan-line 3s linear infinite;
        }
        
        /* Bronze frost effect */
        .bronze-frost {
            background: rgba(35, 28, 15, 0.65);
            backdrop-filter: blur(12px) saturate(110%);
            -webkit-backdrop-filter: blur(12px) saturate(110%);
            border: 1px solid rgba(249, 164, 6, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        /* Glass card effect */
        .glass-card {
            background: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display flex items-center justify-center min-h-screen p-4 sm:p-8">
<!-- Phone Frame -->
<div class="relative w-full max-w-[390px] h-[844px] bg-warm-charcoal overflow-hidden rounded-[40px] shadow-2xl border-[6px] border-[#333]">
<!-- Status Bar Simulator (Top) -->
<div class="absolute top-0 w-full h-12 z-50 flex justify-between items-center px-6 pt-2 text-white text-xs font-medium opacity-80">
<span>9:41</span>
<div class="flex items-center gap-1">
<span class="material-icons-round text-base">signal_cellular_alt</span>
<span class="material-icons-round text-base">wifi</span>
<span class="material-icons-round text-base">battery_full</span>
</div>
</div>
<!-- Camera Viewfinder Background -->
<!-- Image representing the camera feed -->
<div class="absolute inset-0 w-full h-full z-0">
<img alt="Camera feed showing a smartphone" class="w-full h-full object-cover opacity-60" data-alt="Close up of a modern smartphone resting on a wooden table surface" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBxZNvtaEkDdPz1KkSrYCLruJAXbG8R1DIBX-ths0b8DEfxLpG4-r5KtDLr4lm8bUtFdttotq60pf-7vLk7E3jinActSNf1Q6MTvo2TYdlQI_DuRggxB7kq0QsDPwlt-uxM3MG2Bhn4ehE15fkaCMr22uVgUzIsITj4he0UOS-YyHt0m2lHGv5WJZ8LlI36k8i8vbyQJA6DP7XvbL0vWIh-r-1PwklvauF2-GvhCMzGssJMTxWkg0wle42p7VU-Jwfaivu6Q55jjpw"/>
<!-- Warm Charcoal Overlay -->
<div class="absolute inset-0 bg-warm-charcoal/30 mix-blend-multiply"></div>
</div>
<!-- Top Controls -->
<div class="absolute top-14 left-0 w-full z-40 px-6 flex justify-between items-center">
<button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white border border-white/10 active:scale-95 transition-transform">
<span class="material-icons-round">close</span>
</button>
<div class="px-4 py-1.5 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary animate-scan-pulse"></span>
<span class="text-sm font-medium text-white tracking-wide">AI SCANNING</span>
</div>
<button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white border border-white/10 active:scale-95 transition-transform">
<span class="material-icons-round text-primary">flash_on</span>
</button>
</div>
<!-- Scanning Area -->
<div class="absolute inset-0 z-10 flex flex-col items-center justify-center pointer-events-none pb-24">
<!-- Floating Tag (Anchored to object) -->
<div class="absolute top-[35%] left-1/2 transform -translate-x-1/2 -translate-y-[80px] pointer-events-auto">
<div class="bronze-frost rounded-xl px-4 py-2.5 flex items-center gap-3 animate-fade-in-up">
<div class="w-8 h-8 rounded-lg bg-primary/20 flex items-center justify-center border border-primary/30">
<span class="material-icons-round text-primary text-sm">smartphone</span>
</div>
<div>
<p class="text-xs text-primary/80 uppercase font-bold tracking-wider">Identified</p>
<p class="text-white font-bold leading-tight">iPhone 11 Pro</p>
</div>
<div class="h-8 w-[1px] bg-white/10 mx-1"></div>
<span class="material-icons-round text-primary/80 text-sm">check_circle</span>
</div>
<!-- Connecting Line -->
<div class="w-[2px] h-8 bg-gradient-to-b from-primary/50 to-transparent mx-auto mt-[-1px]"></div>
<div class="w-2 h-2 rounded-full bg-primary mx-auto mt-[-2px] shadow-[0_0_10px_rgba(249,164,6,0.8)]"></div>
</div>
<!-- HUD Frame -->
<div class="relative w-64 h-64 border border-white/20 rounded-[2rem]">
<!-- Glow effect behind -->
<div class="absolute inset-0 rounded-[2rem] bg-primary/5 blur-xl"></div>
<!-- Corner Brackets -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-xl shadow-[0_0_15px_rgba(249,164,6,0.5)]"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-xl shadow-[0_0_15px_rgba(249,164,6,0.5)]"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-xl shadow-[0_0_15px_rgba(249,164,6,0.5)]"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-xl shadow-[0_0_15px_rgba(249,164,6,0.5)]"></div>
<!-- Scanning Laser Line -->
<div class="absolute left-2 right-2 h-[2px] bg-primary/80 shadow-[0_0_20px_rgba(249,164,6,0.8)] animate-scan-line"></div>
</div>
<p class="mt-8 text-white/70 text-sm bg-black/30 px-3 py-1 rounded-full backdrop-blur-sm">Hold steady to capture details</p>
</div>
<!-- Bottom Sheet / Glass Card -->
<div class="absolute bottom-0 left-0 w-full z-30 pt-8 pb-8 px-5 glass-card rounded-t-[32px]">
<!-- Drag Handle -->
<div class="absolute top-3 left-1/2 transform -translate-x-1/2 w-12 h-1.5 bg-white/20 rounded-full"></div>
<div class="flex flex-col gap-5">
<!-- Header Info -->
<div class="flex items-start justify-between">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="material-icons-round text-primary text-sm">recycling</span>
<span class="text-xs font-bold text-primary tracking-widest uppercase">Recyclable Item</span>
</div>
<h2 class="text-2xl font-bold text-white">Mobile Phone</h2>
<p class="text-white/50 text-sm">Model: iPhone 11 Pro • 256GB</p>
</div>
<div class="w-12 h-12 rounded-full bg-white/5 border border-white/10 flex items-center justify-center">
<span class="material-icons-outlined text-white/80">info</span>
</div>
</div>
<!-- Stats Grid -->
<div class="grid grid-cols-2 gap-3">
<div class="bg-black/20 rounded-2xl p-4 border border-white/5">
<div class="text-white/50 text-xs mb-1 font-medium">AI Confidence</div>
<div class="flex items-baseline gap-1">
<span class="text-xl font-bold text-white">94</span>
<span class="text-sm text-primary font-bold">%</span>
</div>
<div class="w-full bg-white/10 h-1 mt-2 rounded-full overflow-hidden">
<div class="bg-primary h-full w-[94%] rounded-full"></div>
</div>
</div>
<div class="bg-black/20 rounded-2xl p-4 border border-white/5 relative overflow-hidden">
<div class="absolute -right-4 -top-4 w-16 h-16 bg-primary/10 rounded-full blur-xl"></div>
<div class="text-white/50 text-xs mb-1 font-medium">Estimated Value</div>
<div class="flex items-baseline gap-1">
<span class="text-xl font-bold text-primary">$45</span>
<span class="text-sm text-white/70">.00</span>
</div>
<div class="flex items-center gap-1 mt-2 text-[10px] text-green-400">
<span class="material-icons-round text-[10px]">trending_up</span>
<span>High demand</span>
</div>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold text-lg py-4 rounded-full shadow-[0_4px_20px_rgba(249,164,6,0.3)] transition-all active:scale-[0.98] flex items-center justify-center gap-2 group mt-2">
<span>Confirm &amp; Recycle</span>
<span class="material-icons-round group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
</div>
</body></html>
